<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дашборд — NovaBuild</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

<!-- ── NAVBAR ─────────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-bold" href="dashboard.html">🏗 NovaBuild</a>
  <div class="d-flex align-items-center gap-3">
    <a class="text-white small text-decoration-none fw-semibold" href="dashboard.html">Дашборд</a>
    <a class="text-secondary small text-decoration-none" href="cabinet.html">Профиль</a>
    <span class="text-secondary small" id="nav-email"></span>
    <button class="btn btn-sm btn-outline-secondary" onclick="logout()">Выйти</button>
  </div>
</nav>

<div class="container py-5">

  <!-- CLIENT CONTENT -->
  <div id="client-content" style="display:none">
    <div class="row mb-4 align-items-center">
      <div class="col">
        <h2 class="fw-bold mb-0">Кабинет заказчика</h2>
      </div>
      <div class="col-auto">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#offerModal">
          + Разместить оффер
        </button>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="card text-center p-3">
          <div class="fs-1 fw-bold text-primary" id="stat-offers">—</div>
          <div class="text-muted small">Офферов размещено</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center p-3">
          <div class="fs-1 fw-bold text-success" id="stat-bids">—</div>
          <div class="text-muted small">Заявок получено</div>
        </div>
      </div>
    </div>

    <h5 class="fw-semibold mb-3">Мои офферы</h5>
    <div id="client-offers-list">
      <p class="text-muted">Загрузка...</p>
    </div>
  </div>

  <!-- FREELANCER CONTENT -->
  <div id="freelancer-content" style="display:none">
    <div class="row mb-4 align-items-center">
      <div class="col">
        <h2 class="fw-bold mb-0">Кабинет фрилансера</h2>
      </div>
      <div class="col-auto">
        <span id="verification-badge" class="badge bg-warning text-dark" style="display:none"></span>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="card text-center p-3">
          <div class="fs-1 fw-bold text-primary" id="stat-open-offers">—</div>
          <div class="text-muted small">Открытых офферов</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center p-3">
          <div class="fs-1 fw-bold text-success" id="stat-my-bids">—</div>
          <div class="text-muted small">Моих заявок</div>
        </div>
      </div>
    </div>

    <h5 class="fw-semibold mb-3">Доступные офферы</h5>
    <div id="freelancer-offers-list">
      <p class="text-muted">Загрузка...</p>
    </div>
  </div>

</div>

<!-- ── MODAL: NEW OFFER ────────────────────────────────────────────────────── -->
<div class="modal fade" id="offerModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Новый оффер</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="offer-error" class="alert alert-danger d-none"></div>
        <div class="mb-3">
          <label class="form-label">Заголовок</label>
          <input type="text" class="form-control" id="offer-title" placeholder="Укладка плитки, 50 м²">
        </div>
        <div class="mb-3">
          <label class="form-label">Описание задачи</label>
          <textarea class="form-control" id="offer-desc" rows="4" placeholder="Опишите объём работ, материалы, условия..."></textarea>
        </div>
        <div class="row g-2">
          <div class="col">
            <label class="form-label">Бюджет, ₽</label>
            <input type="number" class="form-control" id="offer-budget" placeholder="50000">
          </div>
          <div class="col">
            <label class="form-label">Срок до</label>
            <input type="date" class="form-control" id="offer-deadline">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button class="btn btn-primary" onclick="submitOffer()">Разместить</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
