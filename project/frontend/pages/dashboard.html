<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дашборд — NovaBuild</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

<!-- ── NAVBAR ─────────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-bold" href="dashboard.html">🏗 NovaBuild</a>
  <div class="d-flex align-items-center gap-4">
    <a class="text-white small text-decoration-none fw-semibold" href="dashboard.html">Дашборд</a>
    <div class="dropdown">
      <button class="btn btn-outline-light rounded-circle avatar-btn" type="button" id="nav-avatar" data-bs-toggle="dropdown" aria-expanded="false">?</button>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="nav-avatar">
        <li><span class="dropdown-item-text small text-muted" id="nav-email"></span></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="cabinet.html">Профиль</a></li>
        <li><a class="dropdown-item" href="#" onclick="logout()">Выйти</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">

  <!-- CLIENT CONTENT -->
  <div id="client-content" class="row g-4" style="display:none">
    <div class="col-lg-8 order-2 order-lg-1">
      <h5 class="fw-semibold mb-3">Мои офферы</h5>
      <div id="client-offers-list">
        <p class="text-muted">Загрузка...</p>
      </div>
    </div>
    <div class="col-lg-4 order-1 order-lg-2">
      <div class="card p-3 mb-3">
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="avatar-lg rounded-circle bg-primary text-white d-flex align-items-center justify-content-center sidebar-avatar">?</div>
          <div>
            <div class="fw-semibold sidebar-name">—</div>
            <div class="text-muted small sidebar-sub"></div>
          </div>
        </div>
        <a href="cabinet.html" class="btn btn-sm btn-outline-secondary w-100 mb-2">Редактировать профиль</a>
        <button class="btn btn-sm btn-primary w-100" data-bs-toggle="modal" data-bs-target="#offerModal">+ Разместить оффер</button>
      </div>
      <div class="card p-3">
        <div class="d-flex justify-content-between py-1">
          <span class="text-muted small">Офферов размещено</span>
          <span class="fw-bold" id="stat-offers">—</span>
        </div>
        <div class="d-flex justify-content-between py-1">
          <span class="text-muted small">Заявок получено</span>
          <span class="fw-bold" id="stat-bids">—</span>
        </div>
      </div>
    </div>
  </div>

  <!-- FREELANCER CONTENT -->
  <div id="freelancer-content" class="row g-4" style="display:none">
    <div class="col-lg-8 order-2 order-lg-1">
      <h5 class="fw-semibold mb-3">Доступные офферы</h5>
      <div id="freelancer-offers-list">
        <p class="text-muted">Загрузка...</p>
      </div>
    </div>
    <div class="col-lg-4 order-1 order-lg-2">
      <div class="card p-3 mb-3">
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="avatar-lg rounded-circle bg-primary text-white d-flex align-items-center justify-content-center sidebar-avatar">?</div>
          <div>
            <div class="fw-semibold sidebar-name">—</div>
            <div class="text-muted small sidebar-sub"></div>
          </div>
        </div>
        <div class="mb-3">
          <span id="verification-badge" class="badge bg-warning text-dark" style="display:none"></span>
        </div>
        <div class="mb-3">
          <div class="d-flex justify-content-between small text-muted mb-1">
            <span>Профиль заполнен</span>
            <span id="profile-completeness-pct">0%</span>
          </div>
          <div class="progress" style="height:6px">
            <div class="progress-bar" id="profile-completeness-bar" style="width:0%"></div>
          </div>
        </div>
        <a href="cabinet.html" class="btn btn-sm btn-outline-secondary w-100">Редактировать профиль</a>
      </div>
      <div class="card p-3">
        <div class="d-flex justify-content-between py-1">
          <span class="text-muted small">Открытых офферов</span>
          <span class="fw-bold" id="stat-open-offers">—</span>
        </div>
        <div class="d-flex justify-content-between py-1">
          <span class="text-muted small">Моих заявок</span>
          <span class="fw-bold" id="stat-my-bids">—</span>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ── MODAL: NEW OFFER ────────────────────────────────────────────────────── -->
<div class="modal fade" id="offerModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Новый оффер</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="offer-error" class="alert alert-danger d-none"></div>
        <div class="mb-3">
          <label class="form-label">Заголовок</label>
          <input type="text" class="form-control" id="offer-title" placeholder="Укладка плитки, 50 м²">
        </div>
        <div class="mb-3">
          <label class="form-label">Описание задачи</label>
          <textarea class="form-control" id="offer-desc" rows="4" placeholder="Опишите объём работ, материалы, условия..."></textarea>
        </div>
        <div class="row g-2">
          <div class="col">
            <label class="form-label">Бюджет, ₴</label>
            <input type="number" class="form-control" id="offer-budget" placeholder="50000">
          </div>
          <div class="col">
            <label class="form-label">Срок до</label>
            <input type="date" class="form-control" id="offer-deadline">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button class="btn btn-primary" onclick="submitOffer()">Разместить</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
