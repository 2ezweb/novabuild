<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Профіль фрилансера — NovaBuild</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css?v=21">
</head>
<body>

<!-- ── NAVBAR ─────────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-dark bg-dark px-4">
  <div class="d-flex align-items-center gap-4">
    <a class="navbar-brand fw-bold mb-0" href="dashboard.html" id="nav-brand">🏗 NovaBuild</a>
    <a class="text-white small text-decoration-none fw-semibold" href="dashboard.html" id="nav-home-link">Дашборд</a>
    <a class="text-white small text-decoration-none fw-semibold" href="chats.html" id="nav-chat-link" style="display:none">Чат</a>
    <a class="text-white small text-decoration-none fw-semibold" href="contracts.html" id="nav-work-link" style="display:none">Контракти</a>
  </div>
  <div class="d-flex align-items-center gap-2">
    <div class="dropdown">
      <button class="btn btn-outline-light rounded-circle avatar-btn position-relative" type="button" id="nav-bell" data-bs-toggle="dropdown" aria-expanded="false" title="Сповіщення">
        🔔
        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger rounded-circle" id="bell-dot" style="display:none"></span>
      </button>
      <div class="dropdown-menu dropdown-menu-end p-0 notifications-dropdown" id="notifications-list">
        <div class="text-muted small p-3 text-center">Завантаження...</div>
      </div>
    </div>
    <div class="dropdown">
      <button class="btn btn-outline-light rounded-circle avatar-btn" type="button" id="nav-avatar" data-bs-toggle="dropdown" aria-expanded="false">?</button>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="nav-avatar">
        <li><span class="dropdown-item-text small text-muted" id="nav-email"></span></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="cabinet.html">Профіль</a></li>
        <li><a class="dropdown-item" href="#" onclick="logout()">Вийти</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7">

      <div id="profile-error" class="alert alert-warning d-none"></div>

      <div id="profile-content" class="d-none">
        <div class="d-flex align-items-center gap-3 mb-4">
          <div class="avatar-xl rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" id="fp-avatar" style="width:96px;height:96px;font-size:2.25rem;font-weight:600">?</div>
          <div>
            <h3 class="fw-bold mb-1" id="fp-name">—</h3>
            <div class="text-muted" id="fp-specialization"></div>
            <div class="mt-1" id="fp-rating"></div>
          </div>
        </div>

        <button class="btn btn-primary mb-4" id="fp-message-btn" onclick="startConversation()">✉ Написати</button>

        <h6 class="fw-semibold">Про себе</h6>
        <p class="text-muted" id="fp-about" style="white-space:pre-wrap"></p>

        <h6 class="fw-semibold mt-4">Відгуки клієнтів</h6>
        <div id="fp-reviews"></div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js?v=21"></script>
<script src="../js/freelancer-profile.js?v=21"></script>
</body>
</html>
