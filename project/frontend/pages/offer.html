<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заявки на оффер — NovaBuild</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css?v=2">
  <link rel="stylesheet" href="../css/dashboard.css?v=2">
</head>
<body>

<!-- ── NAVBAR ─────────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-dark bg-dark px-4">
  <div class="d-flex align-items-center gap-4">
    <a class="navbar-brand fw-bold mb-0" href="dashboard.html" id="nav-brand">🏗 NovaBuild</a>
    <a class="text-white small text-decoration-none fw-semibold" href="dashboard.html" id="nav-home-link">Дашборд</a>
  </div>
  <div class="d-flex align-items-center gap-2">
    <div class="dropdown">
      <button class="btn btn-outline-light rounded-circle avatar-btn position-relative" type="button" id="nav-bell" data-bs-toggle="dropdown" aria-expanded="false" title="Уведомления">
        🔔
        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger rounded-circle" id="bell-dot" style="display:none"></span>
      </button>
      <div class="dropdown-menu dropdown-menu-end p-0 notifications-dropdown" id="notifications-list">
        <div class="text-muted small p-3 text-center">Загрузка...</div>
      </div>
    </div>
    <div class="dropdown">
      <button class="btn btn-outline-light rounded-circle avatar-btn" type="button" id="nav-avatar" data-bs-toggle="dropdown" aria-expanded="false">?</button>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="nav-avatar">
        <li><span class="dropdown-item-text small text-muted" id="nav-email"></span></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="cabinet.html">Профиль</a></li>
        <li><a class="dropdown-item" href="#" onclick="logout()">Выйти</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <p class="mb-3"><a href="dashboard.html" class="text-decoration-none">← К дашборду</a></p>

  <div id="offer-error" class="alert alert-warning d-none"></div>

  <div id="offer-summary" class="card p-3 mb-4">
    <p class="text-muted">Загрузка...</p>
  </div>

  <h5 class="fw-semibold mb-3">Заявки <span class="text-muted small">(первые 5 мест — по величине ставки, остальные — в случайном порядке)</span></h5>
  <div id="bids-list">
    <p class="text-muted">Загрузка...</p>
  </div>
</div>

<!-- ── FULLSCREEN IMAGE GALLERY ─────────────────────────────────────────────── -->
<div id="image-gallery-overlay" class="align-items-center justify-content-center" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:1090;">
  <button type="button" class="btn btn-light position-absolute" style="top:20px; right:20px;" onclick="closeGallery()">✕ Закрыть</button>
  <button type="button" id="gallery-prev" class="btn btn-light position-absolute" style="left:20px; top:50%; transform:translateY(-50%);" onclick="galleryStep(-1)">‹</button>
  <img id="gallery-image" style="max-width:90vw; max-height:85vh; object-fit:contain;">
  <button type="button" id="gallery-next" class="btn btn-light position-absolute" style="right:20px; top:50%; transform:translateY(-50%);" onclick="galleryStep(1)">›</button>
  <div id="gallery-counter" class="text-white position-absolute" style="bottom:20px; left:50%; transform:translateX(-50%);"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js?v=2"></script>
<script src="../js/offer.js?v=2"></script>
</body>
</html>
