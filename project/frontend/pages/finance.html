<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Фінансовий звіт — NovaBuild</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css?v=21">
  <link rel="stylesheet" href="../css/finance.css?v=21">
</head>
<body>

<!-- ── NAVBAR ─────────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-dark bg-dark px-4">
  <div class="d-flex align-items-center gap-4">
    <a class="navbar-brand fw-bold mb-0" href="dashboard.html" id="nav-brand">🏗 NovaBuild</a>
    <a class="text-white small text-decoration-none fw-semibold" href="dashboard.html" id="nav-home-link">Дашборд</a>
    <a class="text-white small text-decoration-none fw-semibold" href="chats.html" id="nav-chat-link" style="display:none">Чат</a>
    <a class="text-white small text-decoration-none fw-semibold" href="contracts.html" id="nav-work-link" style="display:none">Контракти</a>
  </div>
  <div class="d-flex align-items-center gap-2">
    <div class="dropdown">
      <button class="btn btn-outline-light rounded-circle avatar-btn position-relative" type="button" id="nav-bell" data-bs-toggle="dropdown" aria-expanded="false" title="Сповіщення">
        🔔
        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger rounded-circle" id="bell-dot" style="display:none"></span>
      </button>
      <div class="dropdown-menu dropdown-menu-end p-0 notifications-dropdown" id="notifications-list">
        <div class="text-muted small p-3 text-center">Завантаження...</div>
      </div>
    </div>
    <div class="dropdown">
      <button class="btn btn-outline-light rounded-circle avatar-btn" type="button" id="nav-avatar" data-bs-toggle="dropdown" aria-expanded="false">?</button>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="nav-avatar">
        <li><span class="dropdown-item-text small text-muted" id="nav-email"></span></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="cabinet.html">Профіль</a></li>
        <li><a class="dropdown-item" href="#" onclick="logout()">Вийти</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-9">

      <!-- ── CABINET TABS ─────────────────────────────────────────────────── -->
      <ul class="nav nav-pills mb-4" id="cabinet-tabs">
        <li class="nav-item"><a class="nav-link" href="cabinet.html">Профіль</a></li>
        <li class="nav-item" id="tab-connects-item"><a class="nav-link" href="connects.html">Купити конекти</a></li>
        <li class="nav-item"><a class="nav-link active" href="finance.html">Фінансовий звіт</a></li>
      </ul>

      <h2 class="fw-bold mb-1">Фінансовий звіт</h2>
      <p class="text-muted mb-4">Баланс: <strong id="current-balance">—</strong></p>

      <div id="finance-error" class="alert alert-warning d-none"></div>

      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
        <div class="btn-group" role="group" id="period-group">
          <button type="button" class="btn btn-outline-secondary period-btn active" data-period="month">Місяць</button>
          <button type="button" class="btn btn-outline-secondary period-btn" data-period="year">Рік</button>
          <button type="button" class="btn btn-outline-secondary period-btn" data-period="all">Увесь час</button>
        </div>
        <div class="d-flex gap-3 small" id="finance-totals">
          <span class="finance-legend-item"><span class="finance-line-key" style="background:#2a78d6"></span><span id="totals-in">—</span></span>
          <span class="finance-legend-item"><span class="finance-line-key" style="background:#eb6834"></span><span id="totals-out">—</span></span>
        </div>
      </div>

      <div class="card p-3 position-relative">
        <div id="finance-chart-wrap"><p class="text-muted mb-0">Завантаження...</p></div>
        <div id="finance-tooltip" class="finance-tooltip"></div>
      </div>

      <a href="#" class="small d-inline-block mt-2" id="toggle-table-link" onclick="toggleTable(); return false;" style="display:none">Показати таблицю</a>
      <div id="finance-table-wrap"></div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js?v=21"></script>
<script src="../js/finance.js?v=21"></script>
</body>
</html>
