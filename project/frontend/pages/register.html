<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — BuildMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h2 class="mb-4 fw-bold">🏗 BuildMarket</h2>
      <h4 class="mb-4">Регистрация</h4>
      <div id="reg-error" class="alert alert-danger d-none"></div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="reg-email" placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Пароль</label>
        <input type="password" class="form-control" id="reg-password" placeholder="Минимум 6 символов">
      </div>
      <div class="mb-4">
        <label class="form-label">Я регистрируюсь как</label>
        <div class="d-flex gap-3">
          <div class="role-card flex-fill p-3 border rounded text-center" data-role="client" onclick="selectRole('client')">
            <div class="fs-2">🏢</div>
            <div class="fw-semibold mt-1">Заказчик</div>
            <div class="text-muted small">Размещаю задачи</div>
          </div>
          <div class="role-card flex-fill p-3 border rounded text-center" data-role="freelancer" onclick="selectRole('freelancer')">
            <div class="fs-2">👷</div>
            <div class="fw-semibold mt-1">Фрилансер</div>
            <div class="text-muted small">Ищу работу</div>
          </div>
        </div>
        <input type="hidden" id="reg-role" value="">
      </div>
      <button class="btn btn-success w-100" onclick="doRegister()">Создать аккаунт</button>
      <p class="text-center mt-3 text-muted small">
        Уже есть аккаунт? <a href="login.html">Войти</a>
      </p>
    </div>
  </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
