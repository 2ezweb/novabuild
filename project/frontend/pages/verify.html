<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Подтверждение email — NovaBuild</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css?v=2">
  <link rel="stylesheet" href="../css/auth.css?v=2">
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h2 class="mb-4 fw-bold">🏗 NovaBuild</h2>
      <h4 class="mb-2">Подтвердите email</h4>
      <p class="text-muted small mb-4">
        Мы отправили 6-значный код на <strong id="verify-email-label"></strong>.
        Введите его ниже, чтобы завершить регистрацию.
      </p>

      <div id="verify-error" class="alert alert-danger d-none"></div>
      <div id="verify-success" class="alert alert-success d-none"></div>

      <div class="mb-3">
        <label class="form-label">Код подтверждения</label>
        <input type="text" class="form-control form-control-lg text-center" id="verify-code"
               maxlength="6" inputmode="numeric" placeholder="000000" autocomplete="one-time-code">
      </div>
      <button class="btn btn-primary w-100 mb-3" onclick="doVerify()">Подтвердить</button>

      <p class="text-center text-muted small">
        Не пришёл код?
        <a href="#" onclick="doResend(); return false;">Отправить ещё раз</a>
      </p>
      <p class="text-center text-muted small">
        <a href="login.html">← Назад ко входу</a>
      </p>
    </div>
  </div>
</div>

<script src="../js/common.js?v=2"></script>
<script src="../js/verify.js?v=2"></script>
</body>
</html>
