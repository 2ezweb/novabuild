<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Підтвердження email — NovaBuild</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css?v=27">
  <link rel="stylesheet" href="../css/auth.css?v=27">
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h2 class="mb-4 fw-bold">🏗 NovaBuild</h2>
      <h4 class="mb-2">Підтвердьте email</h4>
      <p class="text-muted small mb-4">
        Ми надіслали 6-значний код на <strong id="verify-email-label"></strong>.
        Введіть його нижче, щоб завершити реєстрацію.
      </p>

      <div id="verify-error" class="alert alert-danger d-none"></div>
      <div id="verify-success" class="alert alert-success d-none"></div>

      <div class="mb-3">
        <label class="form-label">Код підтвердження</label>
        <input type="text" class="form-control form-control-lg text-center" id="verify-code"
               maxlength="6" inputmode="numeric" placeholder="000000" autocomplete="one-time-code">
      </div>
      <button class="btn btn-primary w-100 mb-3" onclick="doVerify()">Підтвердити</button>

      <p class="text-center text-muted small">
        Не прийшов код?
        <a href="#" onclick="doResend(); return false;">Надіслати ще раз</a>
      </p>
      <p class="text-center text-muted small">
        <a href="login.html">← Назад до входу</a>
      </p>
    </div>
  </div>
</div>

<script src="../js/common.js?v=27"></script>
<script src="../js/verify.js?v=27"></script>
</body>
</html>
