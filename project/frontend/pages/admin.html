<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админка — NovaBuild</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<!-- ── NAVBAR ─────────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-dark bg-dark px-4">
  <div class="d-flex align-items-center gap-4">
    <a class="navbar-brand fw-bold mb-0" href="admin.html" id="nav-brand">🏗 NovaBuild</a>
    <a class="text-white small text-decoration-none fw-semibold" href="admin.html" id="nav-home-link">Админка</a>
  </div>
  <div class="d-flex align-items-center gap-2">
    <div class="dropdown">
      <button class="btn btn-outline-light rounded-circle avatar-btn position-relative" type="button" id="nav-bell" data-bs-toggle="dropdown" aria-expanded="false" title="Уведомления">
        🔔
        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger rounded-circle" id="bell-dot" style="display:none"></span>
      </button>
      <div class="dropdown-menu dropdown-menu-end p-0 notifications-dropdown" id="notifications-list">
        <div class="text-muted small p-3 text-center">Загрузка...</div>
      </div>
    </div>
    <div class="dropdown">
      <button class="btn btn-outline-light rounded-circle avatar-btn" type="button" id="nav-avatar" data-bs-toggle="dropdown" aria-expanded="false">?</button>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="nav-avatar">
        <li><span class="dropdown-item-text small text-muted" id="nav-email"></span></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="cabinet.html">Профиль</a></li>
        <li><a class="dropdown-item" href="#" onclick="logout()">Выйти</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="row g-4">
    <div class="col-lg-8 order-2 order-lg-1">

      <div id="admin-section-users">
        <h5 class="fw-semibold mb-3">Все пользователи</h5>
        <div id="admin-users-list"><p class="text-muted">Загрузка...</p></div>
      </div>

      <div id="admin-section-requests" style="display:none">
        <h5 class="fw-semibold mb-3">Заявки на верификацию</h5>
        <div id="admin-requests-list"><p class="text-muted">Загрузка...</p></div>
      </div>

    </div>

    <div class="col-lg-4 order-1 order-lg-2">
      <div class="card p-3 mb-3">
        <div class="d-flex align-items-center gap-3">
          <div class="avatar-lg rounded-circle bg-primary text-white d-flex align-items-center justify-content-center sidebar-avatar">?</div>
          <div>
            <div class="fw-semibold sidebar-name">—</div>
          </div>
        </div>
        <a href="cabinet.html" class="btn btn-sm btn-outline-secondary w-100 mt-3">Редактировать профиль</a>
      </div>
      <div class="card p-0">
        <div class="list-group list-group-flush">
          <button class="list-group-item list-group-item-action active" id="nav-users-btn" onclick="showSection('users')">
            👥 Все пользователи
          </button>
          <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" id="nav-requests-btn" onclick="showSection('requests')">
            📋 Заявки на верификацию
            <span class="badge bg-danger rounded-pill" id="requests-count" style="display:none"></span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── MODAL: VIEW DOCUMENT ────────────────────────────────────────────────── -->
<div class="modal fade" id="documentModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Документ заявителя</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center" id="document-viewer"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
