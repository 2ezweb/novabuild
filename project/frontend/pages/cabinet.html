<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Профиль — NovaBuild</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/cabinet.css">
</head>
<body>

<!-- ── NAVBAR ─────────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-bold" href="dashboard.html">🏗 NovaBuild</a>
  <div class="d-flex align-items-center gap-3">
    <a class="text-secondary small text-decoration-none" href="dashboard.html">Дашборд</a>
    <a class="text-white small text-decoration-none fw-semibold" href="cabinet.html">Профиль</a>
    <span class="text-secondary small" id="nav-email"></span>
    <button class="btn btn-sm btn-outline-secondary" onclick="logout()">Выйти</button>
  </div>
</nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">Личный кабинет</h2>
        <span id="verification-badge" class="badge bg-warning text-dark" style="display:none"></span>
      </div>

      <div id="profile-error" class="alert alert-danger d-none"></div>
      <div id="profile-success" class="alert alert-success d-none">Профиль сохранён</div>

      <!-- freelancer fields -->
      <div id="profile-fields-freelancer" style="display:none">
        <div class="mb-3">
          <label class="form-label">Полное имя</label>
          <input type="text" class="form-control" id="profile-full-name">
        </div>
        <div class="mb-3">
          <label class="form-label">Телефон</label>
          <input type="text" class="form-control" id="profile-phone-fl" placeholder="+380 50 000 00 00">
        </div>
        <div class="mb-3">
          <label class="form-label">Специализация</label>
          <input type="text" class="form-control" id="profile-specialization" placeholder="Плиточник, электрик...">
        </div>
        <div class="mb-3">
          <label class="form-label">О себе</label>
          <textarea class="form-control" id="profile-about" rows="3"></textarea>
        </div>
      </div>

      <!-- client fields -->
      <div id="profile-fields-client" style="display:none">
        <div class="mb-3">
          <label class="form-label">Компания</label>
          <input type="text" class="form-control" id="profile-company-name">
        </div>
        <div class="mb-3">
          <label class="form-label">Контактное имя</label>
          <input type="text" class="form-control" id="profile-contact-name">
        </div>
        <div class="mb-3">
          <label class="form-label">Телефон</label>
          <input type="text" class="form-control" id="profile-phone-cl" placeholder="+380 50 000 00 00">
        </div>
      </div>

      <button class="btn btn-primary" onclick="submitProfile()">Сохранить</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/cabinet.js"></script>
</body>
</html>
