<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — NovaBuild</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h2 class="mb-4 fw-bold">🏗 NovaBuild</h2>
      <h4 class="mb-4">Войти</h4>
      <div id="login-error" class="alert alert-danger d-none"></div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="login-email" placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Пароль</label>
        <input type="password" class="form-control" id="login-password">
      </div>
      <button class="btn btn-primary w-100" onclick="doLogin()">Войти</button>
      <p class="text-center mt-3 text-muted small">
        Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
      </p>
    </div>
  </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
