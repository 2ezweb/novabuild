<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вхід — NovaBuild</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css?v=27">
  <link rel="stylesheet" href="../css/auth.css?v=27">
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h2 class="mb-4 fw-bold">🏗 NovaBuild</h2>
      <h4 class="mb-4">Увійти</h4>
      <div id="login-error" class="alert alert-danger d-none"></div>
      <div class="mb-3">
        <label class="form-label">Email або логін</label>
        <input type="text" class="form-control" id="login-email" placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Пароль</label>
        <input type="password" class="form-control" id="login-password">
      </div>
      <button class="btn btn-primary w-100" onclick="doLogin()">Увійти</button>
      <p class="text-center mt-3 text-muted small">
        Немає акаунта? <a href="register.html">Зареєструватися</a>
      </p>
    </div>
  </div>
</div>

<script src="../js/common.js?v=27"></script>
<script src="../js/auth.js?v=27"></script>
<script>
  // requireAuth() lands here with ?banned=1 when the account got blocked mid-session
  if (new URLSearchParams(location.search).get('banned')) {
    showError('login-error', 'Акаунт заблоковано. Зверніться до підтримки.');
  }
</script>
</body>
</html>
